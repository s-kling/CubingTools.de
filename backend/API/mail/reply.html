<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CubingTools.de</title>
</head>
<body style="margin:0;padding:0;background:#F3F4F6;color:#111827;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#F3F4F6;padding:28px 16px;">
    <tr>
      <td align="center">
        <table width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#FFFFFF;border:1px solid #E5E7EB;border-radius:24px;overflow:hidden;">
          <tr>
            <td style="padding:24px 28px">
              <div style="padding:24px;padding-bottom:0;">
                <p style="margin:0 0 18px;font-size:18px;font-weight:700;color:#0F172A;line-height:1.25;">Hello,</p>
                <div style="font-size:16px;color:#334155;line-height:1.8;white-space:pre-wrap;">${safeReplyText}</div>
                <br>
                <p style="margin:0;font-size:16px;font-weight:700;color:#0F172A;">Best regards,</p><br>
                <div style="display:flex;align-items:center;gap:14px;">
                  <div>
                    <p style="margin:0;font-size:15px;font-weight:700;color:#111827;">${safeSenderName}</p>
                    <p style="margin:4px 0 0;font-size:14px;color:#64748B;">${safeSenderRole}</p>
                    <p style="margin:4px 0 0;font-size:14px;color:#64748B;">${safeSenderUsername}@cubingtools.de</p>

                  </div>
                </div><br>
                <img src="https://cubingtools.de/assets/logo_long.png" alt="CubingTools.de" width="200" style="display:block;height:auto;filter: invert(1);" />
              </div>
            </td>
          </tr>
          <tr>
            <td style="padding:0 28px 28px;">
              <p style="margin:0;font-size:13px;line-height:1.7;color:#64748B;">This message was sent by CubingTools.de. If you have follow-up questions, please reply to this email or visit <a href="https://cubingtools.de/contact" style="color:#4338CA;text-decoration:none;">cubingtools.de/contact</a>.</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
